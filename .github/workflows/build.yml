name: Windows build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: 'Create a GitHub release with this tag (e.g. v0.1.0-beta)'
        type: string
        required: false
        default: 

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Release
        run: dotnet build DatvTx.csproj -c Release -o out

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            git

      - name: Build modulator helper (datvtx_mod.exe)
        shell: msys2 {0}
        run: |
          git clone https://github.com/F5OEO/libdvbmod modhelper/external/libdvbmod
          git -C modhelper/external/libdvbmod checkout eff68b37047196e5bc732b08fa7f73c2bf94107e
          cmake -S modhelper -B modhelper/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build modhelper/build
          cp modhelper/build/datvtx_mod.exe out/
          ./out/datvtx_mod.exe --bitrate --const qpsk --fec 2/3 --sr 333000

      - name: Bundle SDR driver libraries (HackRF)
        shell: msys2 {0}
        run: |
          set +e
          pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-hackrf
          # copy a DLL/EXE and, recursively, every DLL it imports from /ucrt64/bin
          bundle() {
            local f="$1" name dep
            name=$(basename "$f")
            [ -f "out/$name" ] && [ "$2" = "dep" ] && return
            cp "$f" out/ && echo "  + $name"
            for dep in $(objdump -p "$f" | awk '/DLL Name:/ {print $3}'); do
              [ -f "/ucrt64/bin/$dep" ] && [ ! -f "out/$dep" ] && bundle "/ucrt64/bin/$dep" dep
            done
          }
          for f in /ucrt64/bin/libhackrf*.dll /ucrt64/bin/hackrf_info.exe; do
            [ -f "$f" ] && bundle "$f" top
          done
          ls out/*.dll out/*.exe
          [ -f out/libhackrf.dll ] || { echo "libhackrf.dll was not bundled"; exit 1; }
          exit 0

      - name: Build LimeSuite (LimeSDR Mini driver library)
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'LimeSuite'
          $bld = Join-Path $env:RUNNER_TEMP 'ls-build'
          git clone --depth 1 --branch v23.11.0 https://github.com/myriadrf/LimeSuite $src
          # LimeSuite 23.11 relies on headers that newer MSVC no longer includes indirectly
          Get-ChildItem $src -Recurse -Include *.cpp,*.h,*.hpp | ForEach-Object {
            $t = Get-Content $_.FullName -Raw
            if ($t -match 'std::chrono' -and $t -notmatch '#include\s*<chrono>') { Set-Content -Path $_.FullName -Value ("#include <chrono>`n" + $t) -NoNewline }
          }
          cmake -S $src -B $bld -A x64 '-DENABLE_GUI=OFF' '-DENABLE_SOAPY_LMS7=OFF' '-DENABLE_OCTAVE=OFF' '-DENABLE_EXAMPLES=OFF' '-DENABLE_QUICKTEST=OFF' '-DENABLE_DESKTOP=OFF' '-DENABLE_API_DOXYGEN=OFF' '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
          if ($LASTEXITCODE -ne 0) { throw 'LimeSuite configure failed' }
          cmake --build $bld --config Release --target LimeSuite --parallel
          if ($LASTEXITCODE -ne 0) { throw 'LimeSuite build failed' }
          $dll = Get-ChildItem $bld -Recurse -Filter 'LimeSuite.dll' | Select-Object -First 1
          if (-not $dll) { throw 'LimeSuite.dll not produced' }
          Copy-Item $dll.FullName 'out/'
          Write-Host "Bundled $($dll.FullName)"

      - name: Check the modulator loads the bundled LimeSuite library
        shell: pwsh
        run: |
          $o = & 'out/datvtx_mod.exe' --radio lime --sr 333000 --fec 1/2 --port 0 --driver-dir (Resolve-Path out).Path 2>&1 | Out-String
          Write-Host $o
          if ($o -match 'could not load') { throw 'datvtx_mod could not load the bundled LimeSuite.dll' }
          if ($o -notmatch 'no LimeSDR found') { throw 'unexpected modulator output' }
          exit 0

      - name: Check the modulator loads the bundled HackRF library
        shell: pwsh
        run: |
          $o = & 'out/datvtx_mod.exe' --radio hackrf --sr 333000 --fec 1/2 --port 0 --driver-dir (Resolve-Path out).Path 2>&1 | Out-String
          Write-Host $o
          if ($o -match 'could not load') { throw 'datvtx_mod could not load the bundled hackrf DLL' }
          if ($o -notmatch 'no HackRF found') { throw 'unexpected modulator output' }
          exit 0

      - name: Add FFmpeg (BtbN GPL builds)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Get-FFmpeg($url, $name) {
            $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
            & curl.exe -L --fail --retry 5 --retry-delay 5 --retry-all-errors --output $zip $url
            if ($LASTEXITCODE -ne 0) { throw "FFmpeg download failed ($url)" }
            $dest = Join-Path $env:RUNNER_TEMP $name
            Expand-Archive -Path $zip -DestinationPath $dest -Force
            return (Get-ChildItem -Path $dest -Directory -Recurse | Where-Object { $_.Name -eq 'bin' } | Select-Object -First 1).FullName
          }
          # Main build: current master (all codecs incl. H.266 VVC)
          $bin = Get-FFmpeg 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' 'ffmain'
          New-Item -ItemType Directory -Force -Path 'out/ffmpeg' | Out-Null
          Copy-Item "$bin\ffmpeg.exe","$bin\ffplay.exe","$bin\ffprobe.exe" 'out/ffmpeg/'
          $lic = Get-ChildItem -Path (Split-Path $bin) -Recurse -Filter 'LICENSE*' | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName 'out/ffmpeg/LICENSE.txt' }
          # NVENC compatibility build: FFmpeg 7.1 uses NVENC SDK 11.1 (NVIDIA driver 470+);
          # master needs API 13.1 (driver 610+), which fails on GTX 10-series / Studio drivers.
          $url = gh api "repos/BtbN/FFmpeg-Builds/releases?per_page=100" --paginate --jq '.[] | .assets[] | select(.name | test("^ffmpeg-n7\\.1-.*-win64-gpl-7\\.1\\.zip$")) | .browser_download_url' | Select-Object -First 1
          if (-not $url) { throw 'No BtbN FFmpeg 7.1 win64 GPL build found' }
          Write-Host "NVENC compatibility FFmpeg: $url"
          $bin71 = Get-FFmpeg $url 'ff71'
          New-Item -ItemType Directory -Force -Path 'out/ffmpeg/nvenc-compat' | Out-Null
          Copy-Item "$bin71\ffmpeg.exe" 'out/ffmpeg/nvenc-compat/'
          & 'out/ffmpeg/ffmpeg.exe' -hide_banner -encoders | Select-String -Pattern 'libx264|libx265|libvvenc|libsvtav1|libaom|nvenc|_amf|_qsv'

      - name: Encoder self-test (every CPU codec through the real command builder)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'out/DatvTx.exe' -ArgumentList '--selftest','selftest.log' -Wait -PassThru
          Get-Content 'selftest.log'
          if ($p.ExitCode -ne 0) { throw "Encoder self-test failed" }

      - name: Verify output
        shell: pwsh
        run: |
          foreach ($f in 'out/DatvTx.exe','out/datvtx_mod.exe','out/LimeSuite.dll','out/libhackrf.dll','out/ffmpeg/nvenc-compat/ffmpeg.exe','out/MQTTnet.dll','out/Newtonsoft.Json.dll','out/ffmpeg/ffmpeg.exe','out/ffmpeg/ffplay.exe') {
            if (-not (Test-Path $f)) { throw "$f missing" }
          }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: DatvTx-portable
          path: out/

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $tag = '${{ inputs.release_tag }}'
          $ver = if ($tag -like 'v*') { $tag.Substring(1) } else { '0.1.0-dev' }
          & $iscc "/DMyAppVersion=$ver" 'installer\DatvTx.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DatvTx-Windows-Installer
          path: installer-output/*.exe

      - name: Publish GitHub release
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ inputs.release_tag }}'
          $ver = $tag.Substring(1)
          $zip = "installer-output/DatvTx-M0CKE-$ver-portable.zip"
          Compress-Archive -Path 'out/*' -DestinationPath $zip -Force
          $setup = Get-ChildItem 'installer-output/*.exe' | Select-Object -First 1
          $args = @('release', 'create', $tag, $setup.FullName, $zip, '--target', $env:GITHUB_SHA, '--title', "DATV TX (M0CKE) $tag", '--notes-file', 'RELEASE_NOTES.md')
          if ($ver -match '-(alpha|beta|rc)') { $args += '--prerelease' }
          gh @args
          if ($LASTEXITCODE -ne 0) { throw 'release failed' }
