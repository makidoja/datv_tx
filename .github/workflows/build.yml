name: Windows build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Release
        run: dotnet build DatvTx.csproj -c Release -o out

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            git

      - name: Build modulator helper (datvtx_mod.exe)
        shell: msys2 {0}
        run: |
          git clone https://github.com/F5OEO/libdvbmod modhelper/external/libdvbmod
          git -C modhelper/external/libdvbmod checkout eff68b37047196e5bc732b08fa7f73c2bf94107e
          cmake -S modhelper -B modhelper/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build modhelper/build
          cp modhelper/build/datvtx_mod.exe out/
          ./out/datvtx_mod.exe --bitrate --const qpsk --fec 2/3 --sr 333000

      - name: Bundle SDR driver libraries (HackRF)
        shell: msys2 {0}
        run: |
          set +e
          pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-hackrf
          # copy a DLL/EXE and, recursively, every DLL it imports from /ucrt64/bin
          bundle() {
            local f="$1" name dep
            name=$(basename "$f")
            [ -f "out/$name" ] && [ "$2" = "dep" ] && return
            cp "$f" out/ && echo "  + $name"
            for dep in $(objdump -p "$f" | awk '/DLL Name:/ {print $3}'); do
              [ -f "/ucrt64/bin/$dep" ] && [ ! -f "out/$dep" ] && bundle "/ucrt64/bin/$dep" dep
            done
          }
          for f in /ucrt64/bin/libhackrf*.dll /ucrt64/bin/hackrf_info.exe; do
            [ -f "$f" ] && bundle "$f" top
          done
          ls out/*.dll out/*.exe
          [ -f out/libhackrf.dll ] || { echo "libhackrf.dll was not bundled"; exit 1; }
          exit 0

      - name: Build LimeSuite (LimeSDR Mini driver library)
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'LimeSuite'
          $bld = Join-Path $env:RUNNER_TEMP 'ls-build'
          git clone --depth 1 --branch v23.11.0 https://github.com/myriadrf/LimeSuite $src
          cmake -S $src -B $bld -G "Visual Studio 17 2022" -A x64 -DENABLE_GUI=OFF -DENABLE_SOAPY_LMS7=OFF -DENABLE_OCTAVE=OFF -DENABLE_EXAMPLES=OFF -DENABLE_QUICKTEST=OFF -DENABLE_DESKTOP=OFF -DENABLE_API_DOXYGEN=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          if ($LASTEXITCODE -ne 0) { throw 'LimeSuite configure failed' }
          cmake --build $bld --config Release --target LimeSuite --parallel
          if ($LASTEXITCODE -ne 0) { throw 'LimeSuite build failed' }
          $dll = Get-ChildItem $bld -Recurse -Filter 'LimeSuite.dll' | Select-Object -First 1
          if (-not $dll) { throw 'LimeSuite.dll not produced' }
          Copy-Item $dll.FullName 'out/'
          Write-Host "Bundled $($dll.FullName)"

      - name: Check the modulator loads the bundled LimeSuite library
        shell: pwsh
        run: |
          $o = & 'out/datvtx_mod.exe' --radio lime --sr 333000 --fec 1/2 --port 0 --driver-dir (Resolve-Path out).Path 2>&1 | Out-String
          Write-Host $o
          if ($o -match 'could not load') { throw 'datvtx_mod could not load the bundled LimeSuite.dll' }
          if ($o -notmatch 'no LimeSDR found') { throw 'unexpected modulator output' }
          exit 0

      - name: Check the modulator loads the bundled HackRF library
        shell: pwsh
        run: |
          $o = & 'out/datvtx_mod.exe' --radio hackrf --sr 333000 --fec 1/2 --port 0 --driver-dir (Resolve-Path out).Path 2>&1 | Out-String
          Write-Host $o
          if ($o -match 'could not load') { throw 'datvtx_mod could not load the bundled hackrf DLL' }
          if ($o -notmatch 'no HackRF found') { throw 'unexpected modulator output' }
          exit 0

      - name: Add FFmpeg (BtbN GPL build)
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          & curl.exe -L --fail --retry 5 --retry-delay 5 --retry-all-errors --output $zip $url
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg download failed ($LASTEXITCODE)" }
          $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $bin = Get-ChildItem -Path $dest -Directory -Recurse | Where-Object { $_.Name -eq 'bin' } | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path 'out/ffmpeg' | Out-Null
          Copy-Item "$($bin.FullName)\ffmpeg.exe","$($bin.FullName)\ffplay.exe","$($bin.FullName)\ffprobe.exe" 'out/ffmpeg/'
          $lic = Get-ChildItem -Path $dest -Recurse -Filter 'LICENSE*' | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName 'out/ffmpeg/LICENSE.txt' }
          & 'out/ffmpeg/ffmpeg.exe' -hide_banner -encoders | Select-String -Pattern 'libx264|libx265|libvvenc|libsvtav1|libaom|nvenc|_amf|_qsv'

      - name: Encoder self-test (every CPU codec through the real command builder)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'out/DatvTx.exe' -ArgumentList '--selftest','selftest.log' -Wait -PassThru
          Get-Content 'selftest.log'
          if ($p.ExitCode -ne 0) { throw "Encoder self-test failed" }

      - name: Verify output
        shell: pwsh
        run: |
          foreach ($f in 'out/DatvTx.exe','out/datvtx_mod.exe','out/LimeSuite.dll','out/libhackrf.dll','out/MQTTnet.dll','out/Newtonsoft.Json.dll','out/ffmpeg/ffmpeg.exe','out/ffmpeg/ffplay.exe') {
            if (-not (Test-Path $f)) { throw "$f missing" }
          }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: DatvTx-portable
          path: out/

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc 'installer\DatvTx.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DatvTx-Windows-Installer
          path: installer-output/*.exe
