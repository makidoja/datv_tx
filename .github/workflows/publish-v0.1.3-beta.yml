name: Publish v0.1.3-beta

# Committing this file publishes the release: it runs the normal Windows build and creates
# the v0.1.3-beta tag and GitHub release with the installer and portable zip attached.
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/publish-v0.1.3-beta.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/build.yml
    with:
      release_tag: v0.1.3-beta
